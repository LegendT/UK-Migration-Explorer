name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Time-based rules, the twelve-month claim expiry, link rot, source staleness, can only
  # fire if something runs. Without a schedule they fired solely when someone pushed, which
  # left the risk register's top risk unmechanised.
  schedule:
    - cron: '0 7 * * 1'
    # And a monthly one, which raises docs/MONTHLY-CHECK.md. That procedure was written on
    # 12 August 2026 and depended on somebody remembering until this existed, which is the
    # failure mode for anything monthly. The two entries are told apart by
    # `github.event.schedule`, which carries the cron expression that fired, so the weekly run
    # never opens the monthly issue and the monthly run still does everything the weekly does.
    - cron: '0 7 1 * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    # Declared because the release notifier opens an issue. Naming any permission drops every
    # other one to none, so contents is listed too: checkout needs it.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Data contract
        run: node scripts/validate-data.mjs --verbose
      - name: Evidence for every changed or new figure
        # Reads the branch a pull request would merge into, to see which values moved, so it
        # needs one commit of it. actions/checkout takes a depth-1 clone and on a
        # pull_request event does not fetch origin/main at all, so git show origin/main:...
        # fails outright. An explicit fetch rather than fetch-depth: 0, which would slow
        # every job for the benefit of one step.
        #
        # This one gates. Unlike the source check below it is not a network probe that can
        # fail transiently: it compares two files in this repository, and what it catches is
        # a figure nobody has seen in a source.
        #
        # The refspec is written out rather than left as "origin main". A bare fetch updates
        # refs/remotes/origin/main only opportunistically, when the remote's configured
        # refspec happens to cover it, and checkout configures a narrow one on a
        # pull_request event. Written out, the remote-tracking ref is created either way.
        run: |
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node scripts/check-evidence.mjs

      - name: Content contract
        run: node scripts/validate-content.mjs
      - name: Pipeline contract, that this file and npm run validate agree
        # The step that makes the comment above mechanical. Adding a check to `npm run validate`
        # and not here now fails, and so does adding one here and not declaring it, because the
        # manifest in the script is measured against scripts/, against package.json and against
        # this file, including which of these steps carry continue-on-error.
        run: node scripts/check-pipeline.mjs
      - name: Build and check the built site
        run: npm run build
      - name: Accessibility, WCAG 2.2 AA on every URL in .pa11yci.json
        # pa11y over every URL the site serves. It fails the build, unlike the source check
        # below: an accessibility regression is a defect in the artefact, not a transient
        # outage. It is not the whole of the standard. Keyboard operation of the scrolling
        # regions, what the charts announce, focus against both palettes and reflow at 400%
        # were measured by hand during the July 2026 accessibility rounds. Successive
        # rewrites of the planning notes dropped those records while this comment went on
        # pointing at them, so do not read this as saying the evidence is still filed
        # somewhere. Nothing here proves them, and a green run must not be read as though
        # it did.
        run: npm run a11y

      - name: Source URLs still resolve
        # Network check. Must not fail a build on a transient outage, but it previously ran
        # in no pipeline at all.
        run: node scripts/check-sources.mjs
        continue-on-error: true

      - name: Newer releases, and corrections inside the edition the site cites
        id: releases
        # Reports, never gates: a newer edition does not make a published figure wrong, it
        # makes it worth re-checking, and nor does a corrected table, which may not even
        # touch the row this site publishes. It exits 1 so the step below can see that,
        # which is exactly what continue-on-error preserves.
        #
        # shell: bash for the pipefail it sets. Without it the exit code would be tee's, and
        # this step would pass every week while saying otherwise on screen.
        continue-on-error: true
        shell: bash
        run: node scripts/check-releases.mjs | tee release-check.txt

      - name: Raise the monthly check
        # Monthly only. The weekly entry must not fire this, and `github.event.schedule` is what
        # tells them apart: it is the cron expression of the entry that triggered the run, and it
        # is absent on a push, a pull request and a manual dispatch, so all three are excluded by
        # the same condition.
        #
        # ONE CONSTANT TITLE, reused rather than duplicated, which is the release notifier's
        # pattern and matters more here. A monthly condition persists until a person acts on it,
        # so an open issue means the check has not been done and a second one adds nothing. The
        # cost is stated rather than hidden: if last month's issue is never closed, this opens
        # nothing next month, and the procedure is then raised by nobody again.
        #
        # It carries the release check's own output, which is the one part of step 1 the job has
        # already run, and points at the procedure for the rest rather than restating it. Two of
        # that procedure's steps stopped being human work on 13 August 2026, lateness and the
        # publisher list, so the body does not ask for them.
        if: github.event_name == 'schedule' && github.event.schedule == '0 7 1 * *'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='Monthly check: run docs/MONTHLY-CHECK.md'
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Already open, not duplicating: $title"
            exit 0
          fi
          {
            echo "The monthly check is due. The procedure is \`docs/MONTHLY-CHECK.md\` and the"
            echo "prompt beside it is \`docs/prompts/monthly-check.md\`. Nothing here restates it:"
            echo "changing the procedure has to change the job."
            echo
            echo "What it finds goes to \`docs/BACKLOG.md\` in its format. It is not a second list,"
            echo "and it changes no published figure: if one has moved, that is"
            echo "\`docs/UPDATING-DATA.md\` and a separate job."
            echo
            echo "Close this when the run is done, including a run that finds nothing. While it is"
            echo "open, no new monthly issue is raised."
            echo
            echo '## The release check, from this run'
            echo
            echo '```'
            cat release-check.txt 2>/dev/null || echo "The release check did not produce output in this run."
            echo '```'
          } > monthly-issue.md
          gh issue create --title "$title" --body-file monthly-issue.md

      - name: Open an issue when a release is newer or a table was corrected
        # Only from main and the weekly cron. A pull request must not open issues about the
        # state of the world: it did not cause it, and every open PR would race for the same
        # one. The title is deterministic and an existing open issue is reused rather than
        # duplicated. Since 19 August 2026 it names OUTSTANDING WORK only: a source that could
        # not be fetched shares one constant title however many failed, because that condition
        # clears itself when the host answers and is not a job anyone acts on. Before then a
        # network flap changed the title of a genuine issue and opened a second one for work
        # already open, and two issues sat open for the same failed fetch.
        if: steps.releases.outcome == 'failure' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title=$(sed -n 's/^ISSUE-TITLE: //p' release-check.txt)
          kind=$(sed -n 's/^ISSUE-KIND: //p' release-check.txt)
          if [ -z "$title" ] || [ -z "$kind" ]; then
            echo "The release check failed without naming a title and a kind, which it should never do."
            exit 1
          fi
          # A REFUSED FETCH IS NOT A JOB, AND THE SCRIPT HAS SAID SO IN A COMMENT SINCE
          # 19 AUGUST 2026 WHILE THIS STEP OPENED AN ISSUE FOR IT ANYWAY. Five of the six
          # release-check issues ever opened were that: #107, #182, #207, #211, #218 and #221,
          # against one that named real work. Every one was ONS rate-limiting the runner, cleared
          # by itself, and closed by hand.
          #
          # So a refusal raises nothing on a push. It still raises on the crons, weekly and
          # monthly, which is what makes a refusal that PERSISTS visible: the body's own sentence
          # is that a refusal outliving the one-month promise is the shape in which a missed
          # promise would go unseen. A flap at merge time is not that; the same condition still
          # standing on Monday is.
          #
          # It reads ISSUE-KIND rather than matching the title, because the title string would
          # then exist here and in the script, and the copy that drifts is the one nobody reads:
          # the wording changes, the match stops firing, and this quietly opens issues again with
          # every check green.
          if [ "$kind" = unreachable ] && [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "A source could not be reached on a $GITHUB_EVENT_NAME. Not raising it; the cron will if it lasts."
            echo "$title"
            exit 0
          fi
          if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Already open, not duplicating: $title"
          else
            gh issue create --title "$title" --body-file release-check.txt
          fi
